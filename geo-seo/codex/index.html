<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunrise GEO/SEO Monitor</title>
    <style>
      :root {
        --bg: #f7f5ef;
        --panel: #fffdf8;
        --ink: #172026;
        --muted: #66746f;
        --line: #d8d4c9;
        --teal: #19766e;
        --blue: #326fa8;
        --amber: #b87910;
        --coral: #c85d4d;
        --soft: #eef3ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
        margin: 0;
      }

      main {
        margin: 0 auto;
        max-width: 1240px;
        padding: 28px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 38px;
        line-height: 1.12;
      }

      h2 {
        font-size: 21px;
      }

      h3 {
        font-size: 17px;
      }

      .top {
        align-items: end;
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1fr) 320px;
        margin-bottom: 16px;
      }

      .eyebrow,
      .label {
        color: var(--teal);
        display: block;
        font-size: 12px;
        font-weight: 900;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .summary {
        color: var(--muted);
        line-height: 1.7;
        margin-top: 12px;
        max-width: 760px;
      }

      .panel,
      .score-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(47, 42, 32, 0.07);
      }

      .status-card,
      .panel {
        padding: 18px;
      }

      .status-card {
        background: var(--ink);
        border-radius: 8px;
        color: #fffdf8;
      }

      .status-card span,
      .status-card small {
        color: #d4ddd9;
        display: block;
      }

      .status-card strong {
        display: block;
        font-size: 22px;
        margin: 8px 0;
      }

      .grid {
        display: grid;
        gap: 16px;
        margin-bottom: 16px;
      }

      .overview {
        overflow-x: auto;
      }

      .row {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(180px, 1.3fr) 100px 95px 95px 95px 120px minmax(210px, 1.2fr) 118px;
        margin-top: 8px;
        min-width: 1040px;
        padding: 12px;
      }

      .row.header {
        background: #eee9dd;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        margin-top: 0;
      }

      a {
        color: var(--teal);
        font-weight: 800;
        text-decoration: none;
      }

      button {
        background: var(--teal);
        border: 0;
        border-radius: 6px;
        color: #fffdf8;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 900;
        min-height: 38px;
        padding: 8px 10px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .chip {
        background: #e7f4ef;
        border-radius: 999px;
        color: var(--teal);
        display: inline-block;
        font-size: 12px;
        font-weight: 900;
        padding: 5px 8px;
        text-align: center;
      }

      .detail {
        display: none;
      }

      .detail.active {
        display: block;
      }

      .detail-top {
        align-items: start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .score-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 16px;
      }

      .score-card {
        padding: 14px;
      }

      .score-card span {
        color: var(--muted);
        display: block;
        font-size: 13px;
        font-weight: 900;
      }

      .score-card strong {
        color: var(--blue);
        display: block;
        font-size: 34px;
        margin-top: 8px;
      }

      .detail-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .block {
        background: #fbf8f0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }

      .block h3 {
        margin-bottom: 12px;
      }

      .block ul,
      .block ol {
        display: grid;
        gap: 9px;
        margin: 0;
        padding-left: 20px;
      }

      .block li {
        line-height: 1.55;
      }

      .answer {
        border-top: 1px solid var(--line);
        margin-top: 10px;
        padding-top: 10px;
      }

      .empty {
        background: #fbf8f0;
        border: 1px dashed #c7c0b2;
        border-radius: 8px;
        color: var(--muted);
        line-height: 1.7;
        padding: 18px;
      }

      @media (max-width: 920px) {
        main {
          padding: 18px;
        }

        .top,
        .detail-grid,
        .score-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="top">
        <div>
          <span class="eyebrow">Sunrise Expo monitor</span>
          <h1>GEO / SEO 自動掃描中控</h1>
          <p class="summary">
            這個正式版 dashboard 讀取最新掃描結果。每個展會有自己的頻率、Claude 分數、ChatGPT 分數、競爭者與加強建議。
          </p>
        </div>
        <div class="status-card">
          <span>報告狀態</span>
          <strong id="runStatus">載入中</strong>
          <small id="runMeta">正在讀取 data/latest-results.json</small>
        </div>
      </section>

      <section class="panel grid">
        <div>
          <span class="label">Portfolio</span>
          <h2>所有主打展會總表</h2>
        </div>
        <div class="overview" id="overview"></div>
      </section>

      <section class="panel">
        <div class="detail-top">
          <div>
            <span class="label">Event report</span>
            <h2>單一展會測試結果</h2>
          </div>
          <span class="chip">按總表按鈕切換</span>
        </div>
        <div class="empty" id="emptyDetail">請先按某個展會的「查看結果」。</div>
        <div id="details"></div>
      </section>
    </main>

    <script>
      const state = { reports: [] };

      loadResults();

      async function loadResults() {
        try {
          const response = await fetch("data/latest-results.json", { cache: "no-store" });
          if (!response.ok) throw new Error("result file not found");
          const data = await response.json();
          state.reports = data.reports || [];
          document.querySelector("#runStatus").textContent = labelForMode(data.mode);
          document.querySelector("#runMeta").textContent = data.generatedAt
            ? `上次掃描：${formatDate(data.generatedAt)}`
            : data.message;
          renderOverview();
          renderDetails();
        } catch (error) {
          document.querySelector("#runStatus").textContent = "無法讀取";
          document.querySelector("#runMeta").textContent =
            "請用網站伺服器或 GitHub Pages 開啟，直接用 file:// 可能無法讀 JSON。";
          document.querySelector("#overview").innerHTML =
            '<div class="empty">目前無法讀取 data/latest-results.json。</div>';
        }
      }

      function renderOverview() {
        const overview = document.querySelector("#overview");
        if (state.reports.length === 0) {
          overview.innerHTML = '<div class="empty">尚未有正式掃描結果。設定 API key 後執行掃描，這裡會出現每個展會的最新分數。</div>';
          return;
        }

        overview.innerHTML = `
          <div class="row header">
            <span>展會</span><span>頻率</span><span>Claude</span><span>ChatGPT</span><span>台灣 GEO</span><span>狀態</span><span>最重要下一步</span><span>結果</span>
          </div>
          ${state.reports.map(renderOverviewRow).join("")}
        `;

        overview.querySelectorAll("button[data-event]").forEach((button) => {
          button.addEventListener("click", () => showDetail(button.dataset.event));
        });
      }

      function renderOverviewRow(report) {
        const claude = providerScore(report, "Claude");
        const chatgpt = providerScore(report, "ChatGPT");
        return `
          <div class="row">
            <span><strong>${escapeHtml(report.eventName)}</strong><br><a href="${escapeAttribute(report.url)}">展會頁</a></span>
            <span>${frequencyLabel(report.frequency)}</span>
            <span>${scoreLabel(claude)}</span>
            <span>${scoreLabel(chatgpt)}</span>
            <span>${scoreLabel(report.taiwanGeoScore)}</span>
            <span><span class="chip">${statusLabel(report.status)}</span></span>
            <span>${escapeHtml(report.recommendations?.[0] || "等待掃描建議")}</span>
            <span><button type="button" data-event="${escapeAttribute(report.eventId)}">查看結果</button></span>
          </div>
        `;
      }

      function renderDetails() {
        document.querySelector("#details").innerHTML = state.reports
          .map((report) => `
            <article class="detail" id="detail-${escapeAttribute(report.eventId)}">
              <div class="detail-top">
                <div>
                  <span class="label">${escapeHtml(report.eventName)}</span>
                  <h2>${escapeHtml(report.eventName)} 測試結果</h2>
                  <p class="muted">${formatDate(report.scannedAt)} · ${statusLabel(report.status)} · ${report.mode || "GEO/SEO"}</p>
                </div>
                <a href="${escapeAttribute(report.url)}">展會頁</a>
              </div>
              <div class="score-grid">
                <div class="score-card"><span>Claude 台灣 GEO</span><strong>${scoreLabel(providerScore(report, "Claude"))}</strong></div>
                <div class="score-card"><span>ChatGPT 台灣 GEO</span><strong>${scoreLabel(providerScore(report, "ChatGPT"))}</strong></div>
                <div class="score-card"><span>SEO 頁面分數</span><strong>${scoreLabel(report.seoScore)}</strong></div>
                <div class="score-card"><span>競爭比較勝率</span><strong>${scoreLabel(report.competitiveScore)}</strong></div>
              </div>
              <div class="detail-grid">
                <div class="block">
                  <h3>問題產生</h3>
                  <ul>${(report.questions || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
                </div>
                <div class="block">
                  <h3>如何加強</h3>
                  <ol>${(report.recommendations || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ol>
                </div>
                <div class="block">
                  <h3>誰比我強</h3>
                  <ul>${competitorList(report)}</ul>
                </div>
                <div class="block">
                  <h3>原始 AI 回答</h3>
                  ${(report.providers || []).slice(0, 4).map(renderAnswer).join("")}
                </div>
              </div>
            </article>
          `)
          .join("");
      }

      function showDetail(eventId) {
        document.querySelector("#emptyDetail").style.display = "none";
        document.querySelectorAll(".detail").forEach((item) => item.classList.remove("active"));
        const detail = document.querySelector(`#detail-${CSS.escape(eventId)}`);
        if (detail) {
          detail.classList.add("active");
          detail.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      function renderAnswer(output) {
        return `<div class="answer"><strong>${escapeHtml(output.provider)}</strong><p class="muted">${escapeHtml(output.question)}</p><p>${escapeHtml(output.answer)}</p></div>`;
      }

      function competitorList(report) {
        if (!report.competitors?.length) return "<li>本次回答沒有明顯競爭展會壓過你。</li>";
        return report.competitors
          .map((item) => `<li>${escapeHtml(item.name)}：出現 ${item.count} 次</li>`)
          .join("");
      }

      function providerScore(report, provider) {
        const providerRows = (report.providers || []).filter((item) => item.provider === provider);
        if (!providerRows.length) return null;
        const total = providerRows.reduce((sum, item) => sum + item.score.total, 0);
        return Math.round(total / providerRows.length);
      }

      function labelForMode(mode) {
        if (mode === "api") return "正式 AI 實測";
        if (mode === "mock") return "流程測試資料";
        return "尚未掃描";
      }

      function statusLabel(status) {
        if (status === "ai_scored") return "已掃描";
        return "待掃描";
      }

      function frequencyLabel(value) {
        return { weekly: "每週", biweekly: "每兩週", monthly: "每月" }[value] || value;
      }

      function scoreLabel(value) {
        return Number.isFinite(value) ? String(value) : "-";
      }

      function formatDate(value) {
        if (!value) return "尚未掃描";
        return new Intl.DateTimeFormat("zh-TW", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(value));
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }

      function escapeAttribute(value) {
        return escapeHtml(value);
      }
    </script>
  </body>
</html>
