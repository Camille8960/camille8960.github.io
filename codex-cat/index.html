<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
  <div id="app" class="app-shell" aria-live="polite">

    <main class="content" id="content"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="主要導覽">
      <button data-tab="home" class="selected" type="button"><span class="nav-icon">⌂</span><span>首頁</span></button>

    </nav>
    <div id="dialogRoot"></div>
  </div>
  <script src="lab-core.js" defer></script>
  <script src="lab-ocr.js" defer></script>
  <script src="lab-ai.js" defer></script>
